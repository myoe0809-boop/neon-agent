
name: NEON manual run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-agent
  cancel-in-progress: false

jobs:
  run-neon:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NEON
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-report
          path: reports/
          if-no-files-found: warn
          retention-days: 7
